# AHAWAM real-robot deployment config.
# Copy to deploy/deploy.yml and fill in local checkpoint/stat paths.

# Required paths
checkpoint_path: ./checkpoints/ahawam_release/YOUR_CHECKPOINT.pt
dataset_stats_path: ./checkpoints/ahawam_release/YOUR_DATASET_STATS.json
project_root: .

# Hydra config composed from configs/deploy.yml.
hydra_config_name: deploy
task: null

# Inference runtime
device: cuda
mixed_precision: bf16
action_horizon: null
num_inference_steps: 10
sigma_shift: null
seed: null
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
warmup_rounds: 1

# Input image size expected by the public policy wrapper.
video_height: 384
video_width: 320

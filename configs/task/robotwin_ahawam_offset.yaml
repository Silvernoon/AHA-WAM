# @package _global_

defaults:
  - override /data: robotwin
  - override /model: ahawam
  - _self_

batch_size: 16
num_workers: 16
history_aware_batching: true

model:
  mot_checkpoint_mixed_attn: false
  action_dit_pretrained_path: path/to/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  action_horizon: 80
  action_chunk_size: 16
  max_action_offset: 15
  action_obs_downsample_factor: 1
  chunk_kv_editor_num_queries: 32
  num_history_frames: 6
  action_video_read_mode: current_only
  video_rope_frame_stride: ${data.train.action_video_freq_ratio}
  loss:
    lambda_action_prior: 1.0

data:
  train:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 97
    max_action_offset: ${model.max_action_offset}
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}
  val:
    dataset_dirs:
      - path/to/robotwin2.0
    pretrained_norm_stats: path/to/dataset_stats.json
    text_embedding_cache_dir: path/to/text_embeds_cache/robotwin
    num_frames: 97
    max_action_offset: ${model.max_action_offset}
    action_chunk_size: ${model.action_chunk_size}
    action_horizon: ${model.action_horizon}

output_dir: path/to/checkpoints/robotwin_offset/runs/train/${hydra:runtime.choices.task}-${now:%Y-%m-%d}_${now:%H-%M-%S}

wandb:
  enabled: true
  workspace: null
  project: ahawam
  name: robotwin_ahawam_offset
  group: null
  mode: online

lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

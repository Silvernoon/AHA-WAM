# @package _global_
# Neutral Hydra config for public AHAWAM real-robot deployment.

defaults:
  - train
  - override /task: robotwin_ahawam_offset
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  device: cuda
  action_horizon: 80
  num_inference_steps: null
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  dataset_stats_path: null

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
